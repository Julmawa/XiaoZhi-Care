name: Bug report
description: Report a reproducible XiaoZhi Care problem
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload Flash dumps, Wi-Fi credentials, personal data, medication details or private tokens.
  - type: input
    id: version
    attributes:
      label: XiaoZhi Care version
      placeholder: v0.3.2-alpha
    validations:
      required: true
  - type: input
    id: base
    attributes:
      label: XiaoZhi base version
      placeholder: v2.5.0
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware / profile
      placeholder: ESP32-S3 N16R8 / bread-compact-wifi
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data, credentials, tokens and private Flash/NVS dumps.
          required: true
